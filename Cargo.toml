[package]
name = "Local-First"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
inquire = { version = "0.9.4", features = ["date"] }
chrono = { version = "0.4.45", features = ["serde", "std"] }
